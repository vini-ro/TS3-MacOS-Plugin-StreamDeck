<!DOCTYPE html>
<html>

<head lang="en">
    <title>TeamSpeak 3 Plugin Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="API Key">
        <sdpi-password setting="apiKey" placeholder="Enter TeamSpeak ClientQuery API Key"></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Info">
        <p>Enter your TeamSpeak 3 ClientQuery API key for authentication. This is optional but recommended for secure connections.</p>
        <p>You can find or generate your API key in TeamSpeak 3 under Tools → Options → Addons → ClientQuery.</p>
    </sdpi-item>
</body>

</html>
