<!DOCTYPE html>
<html>

<head lang="en">
    <title>Connect Bookmark Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Bookmark UUID">
        <sdpi-textfield setting="bookmarkUuid" placeholder="Enter bookmark UUID"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Bookmark Name">
        <sdpi-textfield setting="bookmarkName" placeholder="Display name"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Password (Optional)">
        <sdpi-password setting="password" placeholder="Server password"></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Info">
        <p>Connect to an existing TeamSpeak 3 bookmark. You can find bookmark UUIDs in your TeamSpeak client settings.</p>
    </sdpi-item>
</body>

</html>
