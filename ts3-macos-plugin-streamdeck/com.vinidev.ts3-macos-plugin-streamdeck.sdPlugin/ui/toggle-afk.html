<!DOCTYPE html>
<html>

<head lang="en">
    <title>Toggle AFK Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Away Message">
        <sdpi-textfield setting="awayMessage" placeholder="Away" default="Away"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Info">
        <p>Toggle AFK (Away) mode in TeamSpeak 3 with a custom message.</p>
    </sdpi-item>
</body>

</html>
