<!DOCTYPE html>
<html>

<head lang="en">
    <title>Switch Channel Settings</title>
    <meta charset="utf-8" />
    <script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>

<body>
    <sdpi-item label="Channel ID">
        <sdpi-textfield setting="channelId" placeholder="Enter channel ID"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Channel Name">
        <sdpi-textfield setting="channelName" placeholder="Display name"></sdpi-textfield>
    </sdpi-item>
    <sdpi-item label="Password (Optional)">
        <sdpi-password setting="password" placeholder="Channel password"></sdpi-password>
    </sdpi-item>
    <sdpi-item label="Info">
        <p>Switch to a specific TeamSpeak 3 channel. You can get the channel ID from the channel list in your TeamSpeak client.</p>
    </sdpi-item>
</body>

</html>
